<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 32 - Centred Login Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);

            /* Centre the login form horizontally and vertically */
            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* Login form card */
        .login-container {
            width: 100%;
            max-width: 400px;
            background-color: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .login-container h1 {
            text-align: center;
            color: #312e81;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        /* Form layout */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #818cf8;
            border-color: #4f46e5;
        }

        .login-button {
            padding: 13px;
            background-color: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .login-button:hover {
            background-color: #3730a3;
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password a {
            color: #4f46e5;
            text-decoration: none;
        }

        .forgot-password a:hover {
            text-decoration: underline;
        }

        .assignment-note {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 20px;
        }

        @media (max-width: 450px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Please enter your details to log in.
        </p>

        <form class="login-form" action="#" method="get">

            <div class="form-group">
                <label for="username">Username or Email</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="login-button">
                Log In
            </button>

        </form>

        <p class="forgot-password">
            <a href="#forgot-password">Forgot your password?</a>
        </p>

        <p class="assignment-note">
            Assignment 32: Centred Login Form Using Flexbox
        </p>

    </main>

</body>
</html>
