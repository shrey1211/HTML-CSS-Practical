<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 41 - Responsive Product Grid</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        /* Main Layout */
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar products"
                "footer footer";
            grid-template-columns: 220px 1fr;
            min-height: 100vh;
        }

        /* Header */
        header {
            grid-area: header;
            background-color: #263238;
            color: white;
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 26px;
        }

        header input {
            padding: 10px;
            width: 250px;
            max-width: 100%;
            border: none;
            border-radius: 5px;
        }

        /* Sidebar */
        aside {
            grid-area: sidebar;
            background-color: white;
            padding: 25px 20px;
            border-right: 1px solid #ddd;
        }

        aside h2 {
            margin-bottom: 15px;
        }

        aside ul {
            list-style: none;
        }

        aside li {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        aside a {
            color: #333;
            text-decoration: none;
        }

        /* Products */
        .products {
            grid-area: products;
            padding: 25px;
        }

        .products h2 {
            margin-bottom: 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: white;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #eaf0f5;
            border-radius: 8px;
            font-size: 55px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #16803c;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-card button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Footer */
        footer {
            grid-area: footer;
            background-color: #263238;
            color: white;
            text-align: center;
            padding: 18px;
        }

        /* BREAKPOINT 1: Tablets */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 180px 1fr;
            }

            .product-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .products {
                padding: 18px;
            }
        }

        /* BREAKPOINT 2: Mobile Phones */
        @media (max-width: 600px) {
            .container {
                grid-template-areas:
                    "header"
                    "sidebar"
                    "products"
                    "footer";
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }

            header input {
                width: 100%;
            }

            aside {
                border-right: none;
                border-bottom: 1px solid #ddd;
            }

            aside ul {
                display: flex;
                flex-wrap: wrap;
                gap: 15px;
            }

            aside li {
                border: none;
                padding: 5px 0;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .products {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>ShopEasy</h1>
            <input type="search" placeholder="Search products..."
                   aria-label="Search products">
        </header>

        <aside>
            <h2>Categories</h2>
            <ul>
                <li><a href="#electronics">Electronics</a></li>
                <li><a href="#fashion">Fashion</a></li>
                <li><a href="#home">Home & Living</a></li>
            </ul>
        </aside>

        <main class="products">
            <h2>Featured Products</h2>

            <div class="product-grid">

                <article class="product-card" id="electronics">
                    <div class="product-image" aria-hidden="true">🎧</div>
                    <h3>Wireless Headphones</h3>
                    <p class="price">₹1,499</p>
                    <button type="button">View Product</button>
                </article>

                <article class="product-card" id="fashion">
                    <div class="product-image" aria-hidden="true">👟</div>
                    <h3>Running Shoes</h3>
                    <p class="price">₹2,199</p>
                    <button type="button">View Product</button>
                </article>

                <article class="product-card" id="home">
                    <div class="product-image" aria-hidden="true">🪴</div>
                    <h3>Decorative Plant</h3>
                    <p class="price">₹499</p>
                    <button type="button">View Product</button>
                </article>

                <article class="product-card">
                    <div class="product-image" aria-hidden="true">⌚</div>
                    <h3>Smart Watch</h3>
                    <p class="price">₹2,999</p>
                    <button type="button">View Product</button>
                </article>

                <article class="product-card">
                    <div class="product-image" aria-hidden="true">🎒</div>
                    <h3>Travel Backpack</h3>
                    <p class="price">₹899</p>
                    <button type="button">View Product</button>
                </article>

                <article class="product-card">
                    <div class="product-image" aria-hidden="true">📷</div>
                    <h3>Digital Camera</h3>
                    <p class="price">₹4,499</p>
                    <button type="button">View Product</button>
                </article>

            </div>
        </main>

        <footer>
            <p>&copy; 2026 ShopEasy. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
